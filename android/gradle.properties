org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
# Keep Gradle JDK selection dynamic (Android Studio or JAVA_HOME) for cross-platform compatibility.
# Avoid hardcoding org.gradle.java.home to an OS-specific path.

# Build stability settings for Windows/mixed-drive environments.
# Avoid Kotlin incremental cache issues when project and dependency caches live on different drive roots.
kotlin.incremental=false
kotlin.compiler.execution.strategy=in-process

# Disable Gradle file-system watching to reduce stale VFS state on non-standard/mapped drives.
org.gradle.vfs.watch=false
