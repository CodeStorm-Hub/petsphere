<!DOCTYPE html>

<html class="light" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
      tailwind.config = {
        darkMode: "class",
        theme: {
          extend: {
            "colors": {
                    "tertiary": "#784b00",
                    "surface-dim": "#cbdbf5",
                    "primary-fixed": "#dbe1ff",
                    "primary-container": "#2563eb",
                    "inverse-surface": "#213145",
                    "surface-variant": "#d3e4fe",
                    "on-tertiary-fixed-variant": "#653e00",
                    "surface-container-lowest": "#ffffff",
                    "inverse-primary": "#b4c5ff",
                    "outline-variant": "#c3c6d7",
                    "surface-container-highest": "#d3e4fe",
                    "error": "#ba1a1a",
                    "on-secondary-container": "#005b78",
                    "on-tertiary": "#ffffff",
                    "secondary-fixed-dim": "#7bd1fa",
                    "tertiary-fixed-dim": "#ffb95f",
                    "outline": "#737686",
                    "on-surface": "#0b1c30",
                    "background": "#f8f9ff",
                    "on-error-container": "#93000a",
                    "surface-container-low": "#eff4ff",
                    "on-secondary-fixed-variant": "#004d66",
                    "tertiary-container": "#996100",
                    "surface-bright": "#f8f9ff",
                    "error-container": "#ffdad6",
                    "surface-container": "#e5eeff",
                    "on-background": "#0b1c30",
                    "surface": "#f8f9ff",
                    "on-tertiary-container": "#ffeedd",
                    "on-primary-fixed": "#00174b",
                    "secondary": "#006686",
                    "on-primary-fixed-variant": "#003ea8",
                    "on-secondary": "#ffffff",
                    "on-tertiary-fixed": "#2a1700",
                    "primary": "#004ac6",
                    "surface-tint": "#0053db",
                    "secondary-container": "#7ed4fd",
                    "primary-fixed-dim": "#b4c5ff",
                    "on-error": "#ffffff",
                    "on-primary-container": "#eeefff",
                    "surface-container-high": "#dce9ff",
                    "on-surface-variant": "#434655",
                    "inverse-on-surface": "#eaf1ff",
                    "tertiary-fixed": "#ffddb8",
                    "on-secondary-fixed": "#001e2b",
                    "secondary-fixed": "#c0e8ff",
                    "on-primary": "#ffffff"
            },
            "borderRadius": {
                    "DEFAULT": "0.25rem",
                    "lg": "0.5rem",
                    "xl": "0.75rem",
                    "full": "9999px"
            },
            "spacing": {
                    "container-padding": "1.5rem",
                    "stack-md": "1rem",
                    "gutter": "1rem",
                    "stack-sm": "0.5rem",
                    "unit": "4px",
                    "stack-lg": "2rem"
            },
            "fontFamily": {
                    "headline-lg-mobile": ["Inter"],
                    "body-sm": ["Inter"],
                    "label-md": ["Inter"],
                    "headline-lg": ["Inter"],
                    "headline-md": ["Inter"],
                    "body-md": ["Inter"],
                    "headline-sm": ["Inter"],
                    "label-lg": ["Inter"],
                    "body-lg": ["Inter"]
            },
            "fontSize": {
                    "headline-lg-mobile": ["28px", {"lineHeight": "36px", "fontWeight": "700"}],
                    "body-sm": ["14px", {"lineHeight": "20px", "fontWeight": "400"}],
                    "label-md": ["12px", {"lineHeight": "16px", "fontWeight": "500"}],
                    "headline-lg": ["32px", {"lineHeight": "40px", "letterSpacing": "-0.02em", "fontWeight": "700"}],
                    "headline-md": ["24px", {"lineHeight": "32px", "letterSpacing": "-0.01em", "fontWeight": "600"}],
                    "body-md": ["16px", {"lineHeight": "24px", "fontWeight": "400"}],
                    "headline-sm": ["20px", {"lineHeight": "28px", "fontWeight": "600"}],
                    "label-lg": ["14px", {"lineHeight": "20px", "letterSpacing": "0.01em", "fontWeight": "600"}],
                    "body-lg": ["18px", {"lineHeight": "28px", "fontWeight": "400"}]
            }
          },
        },
      }
    </script>
<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        .custom-scrollbar::-webkit-scrollbar {
            width: 4px;
        }
        .custom-scrollbar::-webkit-scrollbar-track {
            background: transparent;
        }
        .custom-scrollbar::-webkit-scrollbar-thumb {
            background: #c3c6d7;
            border-radius: 10px;
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
</head>
<body class="bg-background text-on-background font-body-md min-h-screen flex flex-col">
<!-- TopAppBar -->
<header class="fixed top-0 left-0 w-full z-50 flex items-center justify-between px-4 h-16 bg-surface dark:bg-surface-container border-b border-outline-variant dark:border-outline">
<button class="p-2 rounded-full hover:bg-surface-variant transition-colors active:scale-95 duration-200">
<span class="material-symbols-outlined text-primary" data-icon="close">close</span>
</button>
<h1 class="flex items-center justify-center flex-1"><div class="flex items-center gap-2"><img alt="PetFolio Logo" class="w-8 h-8 object-contain" src="https://lh3.googleusercontent.com/aida/ADBb0ujvZD2gG6_7p8u9lN6hiCLhaN-1FUH4rRGPFIZFxpsYLnLUTpkTFvsjyetvh4jiPCxFuSXlqQXVZa6Bs2Rouc2HO-9t9wERV7odsSItp7UO1Dgldeg5YK580eojayypaOecWrZa_zhSpni6L-Kw4ehgDHIHOUPWh1Lr08x1PbEXu8eUQavzWcCN5z8H9M7QXL5oW_pBYNDo-xVz3UUAOjcTzWdzIa6UdETAe7CeRYuXzbHDLHAuNJy5buk"/><span class="font-headline-sm text-headline-sm tracking-tight text-primary font-black">PetFolio</span></div></h1>
<div class="w-10"></div> <!-- Spacer for centering -->
</header>
<main class="flex-1 mt-16 mb-24 overflow-y-auto custom-scrollbar">
<div class="max-w-md mx-auto px-container-padding py-stack-lg">
<!-- Photo Picker -->
<section class="flex flex-col items-center mb-10">
<div class="relative group">
<div class="w-32 h-32 rounded-full bg-surface-container-high border-2 border-dashed border-primary/30 flex items-center justify-center overflow-hidden transition-all hover:border-primary">
<span class="material-symbols-outlined text-primary/40 text-4xl" data-icon="add_a_photo">add_a_photo</span>
</div>
<div class="absolute bottom-0 right-0 bg-primary text-on-primary p-2 rounded-full shadow-lg border-2 border-surface">
<span class="material-symbols-outlined text-sm" data-icon="camera_alt" style="font-variation-settings: 'FILL' 1;">camera_alt</span>
</div>
</div>
<p class="mt-4 font-label-lg text-label-lg text-primary">Add Photo</p>
</section>
<!-- Form Body -->
<form class="space-y-stack-lg">
<!-- Basic Information Section -->
<div class="space-y-stack-md">
<h2 class="font-headline-sm text-headline-sm text-on-surface border-l-4 border-primary pl-3">Basic Information</h2>
<div class="bg-surface-container-lowest p-stack-md rounded-xl shadow-[0_4px_12px_rgba(37,99,235,0.08)] space-y-4">
<div>
<label class="block font-label-lg text-label-lg text-on-surface-variant mb-2">Pet Name</label>
<input class="w-full bg-surface-bright border border-outline-variant rounded-lg px-4 py-3 focus:outline-none focus:ring-2 focus:ring-primary/20 focus:border-primary transition-all text-body-md" placeholder="Enter pet name" type="text"/>
</div>
<div>
<label class="block font-label-lg text-label-lg text-on-surface-variant mb-2">Species</label>
<div class="relative">
<select class="w-full appearance-none bg-surface-bright border border-outline-variant rounded-lg px-4 py-3 focus:outline-none focus:ring-2 focus:ring-primary/20 focus:border-primary transition-all text-body-md">
<option>Dog</option>
<option>Cat</option>
<option>Bird</option>
<option>Fish</option>
<option>Other</option>
</select>
<span class="material-symbols-outlined absolute right-4 top-3.5 pointer-events-none text-outline" data-icon="expand_more">expand_more</span>
</div>
</div>
<div>
<label class="block font-label-lg text-label-lg text-on-surface-variant mb-2">Breed</label>
<div class="relative">
<input class="w-full bg-surface-bright border border-outline-variant rounded-lg pl-10 pr-4 py-3 focus:outline-none focus:ring-2 focus:ring-primary/20 focus:border-primary transition-all text-body-md" placeholder="Search breed" type="text"/>
<span class="material-symbols-outlined absolute left-3 top-3.5 text-outline" data-icon="search">search</span>
</div>
</div>
</div>
</div>
<!-- Details Section -->
<div class="space-y-stack-md">
<h2 class="font-headline-sm text-headline-sm text-on-surface border-l-4 border-primary pl-3">Details</h2>
<div class="bg-surface-container-lowest p-stack-md rounded-xl shadow-[0_4px_12px_rgba(37,99,235,0.08)] space-y-4">
<div>
<label class="block font-label-lg text-label-lg text-on-surface-variant mb-2">Birthday</label>
<div class="relative">
<input class="w-full bg-surface-bright border border-outline-variant rounded-lg px-4 py-3 focus:outline-none focus:ring-2 focus:ring-primary/20 focus:border-primary transition-all text-body-md" type="date"/>
<span class="material-symbols-outlined absolute right-4 top-3.5 pointer-events-none text-primary" data-icon="calendar_today">calendar_today</span>
</div>
</div>
<div>
<label class="block font-label-lg text-label-lg text-on-surface-variant mb-2">Gender</label>
<div class="flex bg-surface-container-low p-1 rounded-lg">
<button class="flex-1 py-2 rounded-lg text-label-lg font-label-lg bg-primary text-on-primary shadow-sm transition-all" type="button">Male</button>
<button class="flex-1 py-2 rounded-lg text-label-lg font-label-lg text-on-surface-variant hover:bg-surface-variant transition-all" type="button">Female</button>
</div>
</div>
<div>
<label class="block font-label-lg text-label-lg text-on-surface-variant mb-2">Weight</label>
<div class="flex gap-2">
<input class="flex-1 bg-surface-bright border border-outline-variant rounded-lg px-4 py-3 focus:outline-none focus:ring-2 focus:ring-primary/20 focus:border-primary transition-all text-body-md" placeholder="0.0" type="number"/>
<div class="flex bg-surface-container-low p-1 rounded-lg shrink-0">
<button class="px-4 py-2 rounded-lg text-label-md font-label-md bg-white text-primary shadow-sm" type="button">kg</button>
<button class="px-4 py-2 rounded-lg text-label-md font-label-md text-on-surface-variant" type="button">lbs</button>
</div>
</div>
</div>
<div>
<label class="block font-label-lg text-label-lg text-on-surface-variant mb-2">Color/Markings</label>
<input class="w-full bg-surface-bright border border-outline-variant rounded-lg px-4 py-3 focus:outline-none focus:ring-2 focus:ring-primary/20 focus:border-primary transition-all text-body-md" placeholder="e.g. Golden brown with white paws" type="text"/>
</div>
</div>
</div>
<!-- More About Section -->
<div class="space-y-stack-md">
<h2 class="font-headline-sm text-headline-sm text-on-surface border-l-4 border-primary pl-3">More About [Pet Name]</h2>
<div class="bg-surface-container-lowest p-stack-md rounded-xl shadow-[0_4px_12px_rgba(37,99,235,0.08)] space-y-4">
<div>
<label class="block font-label-lg text-label-lg text-on-surface-variant mb-2">About/Bio</label>
<textarea class="w-full bg-surface-bright border border-outline-variant rounded-lg px-4 py-3 focus:outline-none focus:ring-2 focus:ring-primary/20 focus:border-primary transition-all text-body-md resize-none" placeholder="Tell us about their personality..." rows="4"></textarea>
</div>
<div class="flex items-center justify-between py-2">
<div>
<label class="block font-label-lg text-label-lg text-on-surface">Neutered / Spayed</label>
<p class="text-body-sm text-on-surface-variant">Has the pet undergone this procedure?</p>
</div>
<label class="relative inline-flex items-center cursor-pointer">
<input class="sr-only peer" type="checkbox" value=""/>
<div class="w-11 h-6 bg-surface-variant peer-focus:outline-none rounded-full peer peer-checked:after:translate-x-full peer-checked:after:border-white after:content-[''] after:absolute after:top-[2px] after:left-[2px] after:bg-white after:border-gray-300 after:border after:rounded-full after:h-5 after:w-5 after:transition-all peer-checked:bg-primary"></div>
</label>
</div>
<div>
<label class="block font-label-lg text-label-lg text-on-surface-variant mb-2">Microchip ID <span class="font-normal opacity-70">(Optional)</span></label>
<input class="w-full bg-surface-bright border border-outline-variant rounded-lg px-4 py-3 focus:outline-none focus:ring-2 focus:ring-primary/20 focus:border-primary transition-all text-body-md" placeholder="15-digit ID number" type="text"/>
</div>
</div>
</div>
</form>
</div>
</main>
<!-- Bottom Action Button -->
<div class="fixed bottom-0 left-0 w-full p-container-padding bg-surface/80 backdrop-blur-md">
<div class="max-w-md mx-auto">
<button class="w-full py-4 bg-gradient-to-r from-primary to-primary-container text-on-primary font-headline-sm rounded-lg shadow-lg shadow-primary/20 active:scale-[0.98] transition-all flex items-center justify-center gap-2">
<span class="material-symbols-outlined" data-icon="add_circle" style="font-variation-settings: 'FILL' 1;">add_circle</span>
                Add Pet
            </button>
</div>
</div>
</body></html>
