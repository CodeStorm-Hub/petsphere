<!DOCTYPE html>

<html class="light" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>PetFolio - New Post</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@300;400;500;600;700;800;900&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        primary: "#2563EB",
                        "on-primary": "#FFFFFF",
                        "primary-container": "#DBEafe",
                        "on-primary-container": "#1E40AF",
                        surface: "#FFFFFF",
                        "on-surface": "#1F2937",
                        "surface-variant": "#F3F4F6",
                        "on-surface-variant": "#4B5563",
                        outline: "#D1D5DB",
                        "outline-variant": "#E5E7EB",
                        secondary: "#475569",
                        "secondary-container": "#F1F5F9"
                    },
                    borderRadius: {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "full": "9999px"
                    },
                    fontFamily: {
                        headline: ["Public Sans", "sans-serif"],
                        display: ["Public Sans", "sans-serif"],
                        body: ["Public Sans", "sans-serif"],
                        label: ["Public Sans", "sans-serif"]
                    }
                },
            },
        }
    </script>
<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
            display: inline-block;
            line-height: 1;
            text-transform: none;
            letter-spacing: normal;
            word-wrap: normal;
            white-space: nowrap;
            direction: ltr;
        }
        .hide-scrollbar::-webkit-scrollbar {
            display: none;
        }
        .hide-scrollbar {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
</head>
<body class="bg-surface text-on-surface font-body antialiased">
<!-- TopAppBar -->
<!-- Content & Identity: Header: "New Post" title, "Cancel" icon on left, "Share" button on right in bold blue. -->
<header class="fixed top-0 left-0 w-full z-50 flex items-center justify-between px-4 h-16 bg-surface border-b border-outline-variant">
<div class="flex items-center gap-3">
<button class="p-1 -ml-1 active:scale-95 transition-transform duration-150 text-on-surface">
<span class="material-symbols-outlined" data-icon="close">close</span>
</button>
<div class="flex items-center gap-2">
<img alt="PetFolio Logo" class="w-8 h-8 object-contain" src="https://lh3.googleusercontent.com/aida/ADBb0ujvZD2gG6_7p8u9lN6hiCLhaN-1FUH4rRGPFIZFxpsYLnLUTpkTFvsjyetvh4jiPCxFuSXlqQXVZa6Bs2Rouc2HO-9t9wERV7odsSItp7UO1Dgldeg5YK580eojayypaOecWrZa_zhSpni6L-Kw4ehgDHIHOUPWh1Lr08x1PbEXu8eUQavzWcCN5z8H9M7QXL5oW_pBYNDo-xVz3UUAOjcTzWdzIa6UdETAe7CeRYuXzbHDLHAuNJy5buk"/>
<span class="font-headline text-xl font-bold text-on-surface tracking-tight">PetFolio</span>
</div>
</div>
<button class="text-primary font-bold text-lg active:scale-95 transition-transform duration-150">
    Share
</button>
</header>
<main class="pt-20 pb-24 px-4 max-w-2xl mx-auto">
<!-- User Row -->
<div class="flex items-center gap-3 mb-6">
<div class="w-12 h-12 rounded-full overflow-hidden border-2 border-primary-container">
<img alt="Buddy" class="w-full h-full object-cover" data-alt="A close-up portrait of a friendly Golden Retriever dog named Buddy with soft golden fur and expressive brown eyes. The lighting is warm and natural, suggesting a bright outdoor afternoon. The background is a soft, blurred green garden which emphasizes the dog's joyful and loyal character. The overall aesthetic is clean and heartwarming, perfectly matching a premium pet social media application." src="https://lh3.googleusercontent.com/aida-public/AB6AXuDLuMbkA-4m4Wb3l98GlX-WEDmbC0tyYiSJv2mCK4cpIj7N8XEsCxWUe-uXNCQolMjwBouq5UPdoJ5qHSuWtdsH34OaVLenZxRYwUHYLMMUryjBEwVmZ9sJlgxr-gErN5nkN8Ji2iC647WR5GI5YbZrPqXRUejagXWlW2TKvSL3VK_KY9ov_r7a9Ef9xEWfg7yJFQHZxEh-UF8Gr4322ZKXQFVI2XCgxinpBghwdoybDSPsBc6ysk8MME1TpzC4jN6Wr4O9yEV9yBA"/>
</div>
<div class="flex flex-col">
<span class="font-bold text-on-surface leading-tight">Buddy</span>
<button class="flex items-center gap-1 mt-0.5 px-2 py-0.5 bg-secondary-container text-on-surface-variant rounded-full text-xs font-medium border border-outline-variant">
<span class="material-symbols-outlined text-[14px]" data-icon="public">public</span>
                    Public
                    <span class="material-symbols-outlined text-[14px]" data-icon="arrow_drop_down">arrow_drop_down</span>
</button>
</div>
</div>
<!-- Main Content Area -->
<div class="space-y-4">
<!-- Text Area -->
<textarea class="w-full border-none focus:ring-0 text-xl placeholder-on-surface-variant/50 resize-none min-h-[120px] bg-transparent" placeholder="What's your pet up to?"></textarea>
<!-- Media Preview Area -->
<div class="relative group">
<div class="rounded-2xl overflow-hidden shadow-sm border border-outline-variant">
<img alt="Puppy preview" class="w-full h-auto aspect-[4/5] object-cover" data-alt="A stunning, high-fidelity photograph of an adorable Golden Retriever puppy sitting on a pristine white studio floor. The lighting is soft and professional, highlighting the fluffy texture of the puppy's cream-colored fur. The puppy has a playful tilt to its head and bright, curious eyes. The color palette is minimal and clean, with soft shadows and a high-key brightness that feels modern and high-end." src="https://lh3.googleusercontent.com/aida-public/AB6AXuAENhobrrVBy7CvCxGLaMfchoBImK_Pvy5azSKlTo-xemCz4VmNkiaMYAph2ISx_w-YQHUV_XpRql82ItoRUeaqdooD3gU6HXPvErk4q4DeRCKLA4JWpbYjFOrG8BKpO4nBL5VJpnm5xmtaJdz8QjRcHnFkopQPxmcEyJGBCJ_uE_tGx2MqGMxtF1SWoR8BNSXT7CCGgdBlAtXTjJp7dwA1G3cV3-xpcnLKmLKVqwq5tw1pttRqGfBlRtqwHZr66FQ79iNKj8ggoe8"/>
</div>
<button class="absolute top-3 right-3 bg-black/50 text-white p-1.5 rounded-full backdrop-blur-md hover:bg-black/70 transition-colors active:scale-90">
<span class="material-symbols-outlined text-sm" data-icon="close">close</span>
</button>
</div>
</div>
<!-- Hashtag Chips -->
<div class="mt-6 flex overflow-x-auto gap-2 pb-2 hide-scrollbar">
<span class="flex-shrink-0 px-4 py-2 bg-primary-container text-on-primary-container rounded-full text-sm font-medium border border-primary/10">#GoldenRetriever</span>
<span class="flex-shrink-0 px-4 py-2 bg-primary-container text-on-primary-container rounded-full text-sm font-medium border border-primary/10">#PuppyLife</span>
<span class="flex-shrink-0 px-4 py-2 bg-primary-container text-on-primary-container rounded-full text-sm font-medium border border-primary/10">#Playtime</span>
<span class="flex-shrink-0 px-4 py-2 bg-primary-container text-on-primary-container rounded-full text-sm font-medium border border-primary/10">#DogPark</span>
</div>
</main>
<!-- Utilities Toolbar -->
<!-- Fixed bottom toolbar with icons: Camera, Image Gallery, Location, Tag Pets, Poll, Feeling -->
<div class="fixed bottom-0 left-0 w-full bg-surface border-t border-outline-variant z-50">
<div class="flex items-center justify-between px-6 py-4 max-w-2xl mx-auto">
<button class="flex items-center justify-center text-on-surface-variant hover:text-primary transition-colors p-2 rounded-xl hover:bg-surface-variant/50">
<span class="material-symbols-outlined" data-icon="photo_camera">photo_camera</span>
</button>
<button class="flex items-center justify-center text-on-surface-variant hover:text-primary transition-colors p-2 rounded-xl hover:bg-surface-variant/50">
<span class="material-symbols-outlined" data-icon="image">image</span>
</button>
<button class="flex items-center justify-center text-on-surface-variant hover:text-primary transition-colors p-2 rounded-xl hover:bg-surface-variant/50">
<span class="material-symbols-outlined" data-icon="location_on">location_on</span>
</button>
<button class="flex items-center justify-center text-on-surface-variant hover:text-primary transition-colors p-2 rounded-xl hover:bg-surface-variant/50">
<span class="material-symbols-outlined" data-icon="pets">pets</span>
</button>
<button class="flex items-center justify-center text-on-surface-variant hover:text-primary transition-colors p-2 rounded-xl hover:bg-surface-variant/50">
<span class="material-symbols-outlined" data-icon="bar_chart">bar_chart</span>
</button>
<button class="flex items-center justify-center text-on-surface-variant hover:text-primary transition-colors p-2 rounded-xl hover:bg-surface-variant/50">
<span class="material-symbols-outlined" data-icon="sentiment_satisfied">sentiment_satisfied</span>
</button>
</div>
<!-- Safe Area Spacer for mobile -->
<div class="h-6 w-full"></div>
</div>
<!-- Hidden BottomNavBar (Suppressed for focused "New Post" task) -->
<!-- As per instructions: "If the page content does not logically sit under the categories defined in the JSON, suppress the navigation to prioritize the content canvas." This is a focused task screen. -->
</body></html>
