# Supabase Configuration
# Reference: https://supabase.com/docs/reference/cli/supabase-init

[project]
# Project ID from Supabase dashboard
project_id = "foubokcqaxyqgjhtgzsx"

[api]
# Proxy server configuration
enabled = true

[db]
# Database connection pooling
port = 54322
shadow_database_url = "postgresql://postgres:postgres@localhost:54323/postgres"

[studio]
# Studio runs on this port
enabled = true
port = 54323

[inbucket]
# Email testing
enabled = true
smtp_port = 54324
pop3_port = 54325
api_port = 54326
www_port = 54327

[auth]
# Auth configuration
enabled = true
email.enable_signup = true
email.double_confirm_changes = false
email.enable_confirmations = false
# Use these for local testing
jwt.exp = 3600
external.apple.enabled = false
external.azure.enabled = false
external.facebook.enabled = false
external.github.enabled = false
external.gitlab.enabled = false
external.google.enabled = false
external.keycloak.enabled = false
external.linkedin.enabled = false
external.linkedin_oidc.enabled = false
external.notion.enabled = false
external.twitch.enabled = false
external.twitter.enabled = false
external.slack.enabled = false
external.spotify.enabled = false
external.workos.enabled = false
external.zoom.enabled = false

[realtime]
# Realtime is enabled by default
enabled = true
ip_version = "IPv4"

[storage]
# Storage is enabled by default
enabled = true

[functions]
# Edge functions
enabled = true
verify_jwt = false
