<!DOCTYPE html>

<html class="light" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
      tailwind.config = {
        darkMode: "class",
        theme: {
          extend: {
            "colors": {
                    "tertiary-fixed-dim": "#d7eed8",
                    "on-error": "#fff7f6",
                    "primary-container": "#ffad93",
                    "on-secondary-fixed": "#4e3d00",
                    "tertiary": "#506453",
                    "on-primary": "#fff7f5",
                    "error-dim": "#70030f",
                    "tertiary-dim": "#445847",
                    "on-secondary-fixed-variant": "#705900",
                    "surface-container-low": "#f9f3ed",
                    "secondary-dim": "#665100",
                    "error": "#ac3434",
                    "primary-fixed": "#ffad93",
                    "secondary-fixed": "#ffe087",
                    "on-surface-variant": "#625e59",
                    "outline": "#7f7a74",

                    "surface-container-high": "#eee7e0",
                    "surface-variant": "#e8e1da",
                    "surface-dim": "#e0d9d1",
                    "on-tertiary-fixed-variant": "#586d5b",
                    "surface-container-highest": "#e8e1da",
                    "primary": "#99472c",
                    "secondary-fixed-dim": "#fad04b",
                    "on-tertiary-fixed": "#3c503f",
                    "inverse-on-surface": "#a09c98",
                    "inverse-surface": "#0f0e0b",
                    "primary-fixed-dim": "#ff9878",
                    "on-primary-container": "#6c250d",
                    "outline-variant": "#b7b1aa",
                    "surface-bright": "#fef8f3",
                    "on-tertiary": "#e8ffe8",
                    "tertiary-fixed": "#e5fde6",
                    "secondary": "#745c00",
                    "inverse-primary": "#fd9574",
                    "surface-container": "#f3ede6",
                    "surface-tint": "#99472c",
                    "on-error-container": "#65000b",
                    "primary-dim": "#8a3b21",

                    "secondary-container": "#ffe087"
            },
            "borderRadius": {
                    "DEFAULT": "1rem",
                    "lg": "2rem",
                    "xl": "3rem",
                    "full": "9999px"
            },
            "fontFamily": {
                    "headline": ["Plus Jakarta Sans"],
                    "display": ["Plus Jakarta Sans"],
                    "body": ["Plus Jakarta Sans"],
                    "label": ["Plus Jakarta Sans"]
            }
          },
        },
      }
    </script>
<style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; }
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        .bg-login-pattern {
            background-color: #fef8f3;
            background-image: radial-gradient(#e8e1da 0.5px, transparent 0.5px);
            background-size: 24px 24px;
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-login-pattern text-on-surface min-h-screen flex flex-col items-center justify-center p-6">
<!-- Top Navigation Bar (Suppressed because it is transactional, but keeping branding as requested) -->
<header class="fixed top-0 left-0 w-full z-50 flex items-center justify-center px-6 h-20">
<div class="flex items-center gap-2">
<span class="material-symbols-outlined text-primary text-3xl" data-icon="pets" style="font-variation-settings: 'FILL' 1;">pets</span>
<span class="text-orange-900 font-extrabold tracking-tighter text-2xl font-headline">The Nurtured Atelier</span>
</div>
</header>
<!-- Main Content Canvas -->
<main class="w-full max-w-[440px] flex flex-col items-center mt-12 mb-20">
<!-- Welcome Section -->
<section class="text-center mb-10">
<h1 class="text-4xl font-extrabold text-on-surface tracking-tight leading-tight mb-3">Welcome Back</h1>
<p class="text-on-surface-variant font-medium">Rejoin your nurtured journey with us.</p>
</section>
<!-- Login Form -->
<div class="w-full space-y-6">
<!-- Email Field -->
<div class="space-y-2">
<label class="block text-sm font-bold text-on-surface-variant ml-2 uppercase tracking-widest text-[10px]" for="email">Email Address</label>
<div class="relative">
<span class="absolute left-5 top-1/2 -translate-y-1/2 material-symbols-outlined text-outline" data-icon="mail">mail</span>
<input class="w-full pl-14 pr-6 py-4 bg-surface-container-highest border-none rounded-xl text-on-surface placeholder:text-outline focus:ring-2 focus:ring-primary/20 focus:bg-surface-container-lowest transition-all duration-300 outline-none" id="email" placeholder="hello@nurtured.com" type="email"/>
</div>
</div>
<!-- Password Field -->
<div class="space-y-2">
<div class="flex justify-between items-end ml-2 mr-2">
<label class="block text-sm font-bold text-on-surface-variant uppercase tracking-widest text-[10px]" for="password">Password</label>
<a class="text-[11px] font-bold text-primary hover:text-primary-dim transition-colors" href="#">Forgot Password?</a>
</div>
<div class="relative">
<span class="absolute left-5 top-1/2 -translate-y-1/2 material-symbols-outlined text-outline" data-icon="lock">lock</span>
<input class="w-full pl-14 pr-14 py-4 bg-surface-container-highest border-none rounded-xl text-on-surface placeholder:text-outline focus:ring-2 focus:ring-primary/20 focus:bg-surface-container-lowest transition-all duration-300 outline-none" id="password" placeholder="••••••••" type="password"/>
<button class="absolute right-5 top-1/2 -translate-y-1/2 text-outline hover:text-primary transition-colors" type="button">
<span class="material-symbols-outlined" data-icon="visibility">visibility</span>
</button>
</div>
</div>
<!-- Sign In Button -->
<button class="w-full py-5 rounded-full bg-gradient-to-br from-primary to-primary-dim text-on-primary font-extrabold text-lg shadow-lg shadow-primary/20 active:scale-95 transition-all duration-300">
                Sign In
            </button>
</div>
<!-- Divider -->
<div class="w-full flex items-center gap-4 my-10">
<div class="h-[1px] flex-1 bg-outline-variant/30"></div>
<span class="text-[10px] font-black text-outline uppercase tracking-[0.2em]">or continue with</span>
<div class="h-[1px] flex-1 bg-outline-variant/30"></div>
</div>
<!-- Social Logins -->
<div class="w-full grid grid-cols-2 gap-4">
<button class="flex items-center justify-center gap-3 py-4 bg-surface-container-lowest rounded-full border border-outline-variant/10 shadow-sm hover:shadow-md hover:bg-white transition-all duration-300">
<img alt="Google" class="w-5 h-5" data-alt="Official Google logo icon with its signature four colors on a transparent background" src="https://lh3.googleusercontent.com/aida-public/AB6AXuCmGOoAo4U6kLKl4y7fP4vkYnRMWhuwQ3nZ6BnExjNjph3eRfCIg12ezcCogjMaNmdqtxR_SbUL5RYJu95VBL9G63gDEB_detEfGWMpDJHhrwZVeFiyxlndoUBPAOEK6M7xrQzPLIybYdxAeCKixfjcaIEo7OCdGvAH1orTjVlpNv4R14D0H2oga0BJPvKQcHZ2_lkV6j6Qc94ViDUV2keGyJUeB-ECQPZbRy2OVNw7KBDHz4E91bYq12ClfPCTL8T7cT8t1gBtP-h6"/>
<span class="font-bold text-on-surface-variant text-sm">Google</span>
</button>
<button class="flex items-center justify-center gap-3 py-4 bg-surface-container-lowest rounded-full border border-outline-variant/10 shadow-sm hover:shadow-md hover:bg-white transition-all duration-300">
<span class="material-symbols-outlined text-on-surface text-xl" data-icon="apple" style="font-variation-settings: 'FILL' 1;">ios</span>
<span class="font-bold text-on-surface-variant text-sm">Apple</span>
</button>
</div>
<!-- Register Link -->
<footer class="mt-12 text-center">
<p class="text-on-surface-variant font-medium text-sm">
                Don't have an account? 
                <button class="ml-1 font-extrabold text-primary hover:underline transition-all">Register</button>
</p>
</footer>
</main>
<!-- Aesthetic Decorative Elements -->
<div class="fixed bottom-0 left-0 w-full h-1/3 bg-gradient-to-t from-secondary-container/20 to-transparent -z-10 pointer-events-none"></div>
<div class="fixed top-20 right-[10%] w-64 h-64 bg-primary/5 blur-[120px] rounded-full -z-10"></div>
<div class="fixed bottom-20 left-[10%] w-64 h-64 bg-tertiary/5 blur-[120px] rounded-full -z-10"></div>
</body></html>
