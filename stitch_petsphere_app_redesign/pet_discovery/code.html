            background-color: #fef8f3;
        }

<style>

<body class="bg-background text-on-background min-h-screen pb-32">
<!-- TopAppBar -->
<header class="fixed top-0 w-full z-50 bg-[#fef8f3]/80 dark:bg-[#35322d]/80 backdrop-blur-md shadow-[0_8px_24px_rgba(153,71,44,0.08)]">
<div class="flex justify-between items-center px-6 py-4 w-full">
<div class="flex items-center gap-4">
<button class="material-symbols-outlined text-[#99472c] scale-95 active:scale-90 transition-transform">menu</button>
<h1 class="font-['Plus_Jakarta_Sans'] tracking-tight text-[#35322d] dark:text-[#fef8f3] font-bold text-xl tracking-tighter">The Nurtured Atelier</h1>
</div>
<div class="w-10 h-10 rounded-full bg-surface-container border-2 border-primary-container overflow-hidden">
<img alt="Pet owner profile" class="w-full h-full object-cover" data-alt="portrait of a kind-looking pet owner with a gentle smile in a softly lit warm interior" src="https://lh3.googleusercontent.com/aida-public/AB6AXuCwzUlQlouHZsx60_1FRSAh-zLgtGEZu89dFgQBrO6V74XkDg1eAwozaOzhzEBlp-L-5ao0q1Un7g1D-QdLHILeJ36dp8gBM6Gt2-uJM-vxbr0BoUjBiGwz4wBLFiUUErBYkqa3qd2vg8b1I39C2BwUd4iCaENfKvdEMRJFd0bodM5Le1S4wV8u1jwPW8yQwuS77UOJHIqwxdRp5PvwN9w7JTnw_nzhiJ-haeUaP7g0GhB6oaGNCRV1-dCEP9u-AMK5AC2QS084AX5k"/>
</div>
</div>

<div class="flex gap-3 mb-8 w-full overflow-x-auto pb-2 no-scrollbar">
<button class="bg-tertiary text-on-tertiary px-6 py-2 rounded-full text-sm font-medium whitespace-nowrap">For You</button>
<button class="bg-tertiary-container text-on-tertiary-container px-6 py-2 rounded-full text-sm font-medium whitespace-nowrap">Dogs</button>
<button class="bg-tertiary-container text-on-tertiary-container px-6 py-2 rounded-full text-sm font-medium whitespace-nowrap">Cats</button>
<button class="bg-tertiary-container text-on-tertiary-container px-6 py-2 rounded-full text-sm font-medium whitespace-nowrap">Nearby</button>
</div>
<!-- Discovery Card Stack -->
<div class="relative w-full aspect-[3/4] max-h-[600px]">
<!-- Background Card (Stack Effect) -->
<div class="absolute inset-0 translate-y-4 scale-95 bg-surface-container-low rounded-lg -z-10 shadow-sm opacity-60"></div>
<!-- Main Active Card -->
<div class="absolute inset-0 bg-surface-container-lowest rounded-lg overflow-hidden shadow-[0_24px_48px_rgba(153,71,44,0.12)] border-outline-variant/10 border flex flex-col">
<div class="relative flex-1">
<img alt="Luna" class="w-full h-full object-cover" data-alt="majestic golden retriever sitting happily in a field of wildflowers during golden hour sunset lighting" src="https://lh3.googleusercontent.com/aida-public/AB6AXuBX9fCEIN7WiXNT6MKFbiMfR-936pHEUrxYN5BiVV0rTZpOwAD6dVFdtZCwCNydzBHfApiBuSvS3VJSMnU9yPJ2c3wZrUPtoqiKwM7YxizoGFbmDWu6iEXPSqT2TyTvXoJQ8250eng2sYoVP005uC7T4-Xkij0_Z-yzP4I3FQ6MFrrnvCM3Vg2qQC0iJTexWPjG3II17IpFBJUSzeBHqMxaVBcWIT23KN7q97H3WfvBnGpNhzlpf83DPkL3GaXOOwyZ6VMf2hmBpR4k"/>

<span class="material-symbols-outlined text-primary text-sm">location_on</span>
<span class="text-on-surface text-xs font-semibold tracking-tight">5 miles away</span>
</div>
</div>
<div class="p-8">
<div class="flex justify-between items-end">
<div>
<h2 class="text-3xl font-bold text-on-surface tracking-tight font-headline">Luna</h2>
<p class="text-on-surface-variant text-lg font-medium mt-1">2 years • Golden Retriever</p>
</div>
<div class="bg-secondary-fixed-dim w-12 h-12 rounded-full flex items-center justify-center">
<span class="material-symbols-outlined text-on-secondary-fixed fill-icon">pets</span>
</div>
</div>
<!-- Traits Bento Grid -->
<div class="grid grid-cols-3 gap-3 mt-6">
<div class="bg-surface-container p-3 rounded-xl text-center">
<span class="block text-xs text-on-surface-variant mb-1 font-medium">Energy</span>
<span class="text-sm font-bold text-primary">High</span>
</div>
<div class="bg-surface-container p-3 rounded-xl text-center">
<span class="block text-xs text-on-surface-variant mb-1 font-medium">Health</span>
<span class="text-sm font-bold text-primary">Perfect</span>
</div>
<div class="bg-surface-container p-3 rounded-xl text-center">
<span class="block text-xs text-on-surface-variant mb-1 font-medium">Social</span>
<span class="text-sm font-bold text-primary">Friendly</span>
</div>
</div>
</div>
</div>
</div>

<div class="flex justify-center items-center gap-8 mt-12 mb-12">

<button class="w-16 h-16 rounded-full bg-surface-container-lowest shadow-lg flex items-center justify-center text-outline transition-all active:scale-90 hover:shadow-xl group">
<span class="material-symbols-outlined text-3xl group-hover:text-error transition-colors">close</span>
</button>
<!-- Like Button -->
<button class="w-20 h-20 rounded-full bg-gradient-to-br from-primary to-primary-container shadow-[0_8px_24px_rgba(153,71,44,0.3)] flex items-center justify-center text-white transition-all active:scale-90 hover:shadow-2xl">
<span class="material-symbols-outlined text-4xl fill-icon">favorite</span>
</button>
<!-- Details Button -->
<button class="w-16 h-16 rounded-full bg-surface-container-lowest shadow-lg flex items-center justify-center text-outline transition-all active:scale-90 hover:shadow-xl group">
<span class="material-symbols-outlined text-3xl group-hover:text-tertiary transition-colors">star</span>

<a class="text-[#625e59] dark:text-[#b7b1aa] p-3 hover:bg-[#f3ede6] dark:hover:bg-[#4a4742] rounded-full transition-colors scale-110 active:scale-95 duration-300" href="#">
<span class="material-symbols-outlined">pets</span>

</a>
<a class="text-[#625e59] dark:text-[#b7b1aa] p-3 hover:bg-[#f3ede6] dark:hover:bg-[#4a4742] rounded-full transition-colors scale-110 active:scale-95 duration-300" href="#">
<span class="material-symbols-outlined">chat_bubble</span>
</a>
<a class="text-[#625e59] dark:text-[#b7b1aa] p-3 hover:bg-[#f3ede6] dark:hover:bg-[#4a4742] rounded-full transition-colors scale-110 active:scale-95 duration-300" href="#">
<span class="material-symbols-outlined">person</span>
</a>
</nav>
